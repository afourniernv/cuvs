[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0.0",
    "wheel",
]

[project]
name = "cuvs-bench-opensearch"
dynamic = ["version"]
description = "OpenSearch backend plugin for cuvs-bench"
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cuvs-bench",
    "opensearch-py>=2.4.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/rapidsai/cuvs"

[project.entry-points."cuvs_bench.backends"]
opensearch = "cuvs_bench_opensearch:register"

[project.entry-points."cuvs_bench.config_loaders"]
opensearch = "cuvs_bench_opensearch:register"

[tool.setuptools.dynamic]
version = { file = "cuvs_bench_opensearch/VERSION" }

[tool.setuptools.package-data]
"*" = ["*.*", "VERSION"]
